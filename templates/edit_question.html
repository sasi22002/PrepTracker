<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Question</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body {
            background-color: #f7f7f7;
        }
        .container {
            margin-top: 50px;
            max-width: 600px;
            background-color: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .btn-save {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-save:hover {
            background-color: #0056b3;
        }
        .answer-terminal {
            color: #f0f0f0;
            background: #000000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Cascadia Code', 'Fira Code', 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            transition: all 0.3s ease;
        }
        .answer-terminal:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.3);
            outline: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Question</h1>
        <form id="editQuestionForm">
            <input type="hidden" id="questionId" value="{{ question[0].id }}">
            <div class="form-group">
                <label for="question">Question</label>
                <textarea class="form-control" id="question" rows="3" required>{{ question[0].question }}</textarea>
            </div>
            <div class="form-group">
                <label for="answer">Answer</label>
                <textarea class="form-control answer-terminal" id="answer" rows="4" required placeholder="Enter your answer here... Use code formatting for better readability">{{ question[0].answer }}</textarea>
            </div>
            <div class="form-group">
                <label for="questionType">Question Type</label>
                <select class="form-control" id="questionType" required>
                    <option value="">Select Type</option>
                    <option value="Python" {% if question[0].question_type == 'Python' %}selected{% endif %}>Python</option>
                    <option value="Django" {% if question[0].question_type == 'Django' %}selected{% endif %}>Django</option>
                    <option value="Cloud" {% if question[0].question_type == 'Cloud' %}selected{% endif %}>Cloud</option>
                    <option value="General" {% if question[0].question_type == 'General' %}selected{% endif %}>General</option>
                    <option value="Others" {% if question[0].question_type == 'Others' %}selected{% endif %}>Others</option>
                    <option value="Database" {% if question[0].question_type == 'Database' %}selected{% endif %}>Database</option>
                    <option value="Pandas" {% if question[0].question_type == 'Pandas' %}selected{% endif %}>Pandas</option>
                </select>
            </div>
            <div class="form-group">
                <label>Company</label>
                <input type="text" class="form-control" value="{{ question[0].comapny_question__company_name }}" readonly>
                <small class="form-text text-muted">Company cannot be changed after question creation.</small>
            </div>
            <button type="submit" class="btn-save">Save Changes</button>
        </form>
        
        <div class="mt-3">
            <a href="{{ url_for('view_single_question', id=question[0].id) }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Question
            </a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        $('#editQuestionForm').on('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                id: $('#questionId').val(),
                question: $('#question').val(),
                answer: $('#answer').val(),
                question_type: $('#questionType').val()
            };

            fetch('/edit_question/view/{{ question[0].id }}/', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Question updated successfully!');
                    window.location.href = '/add_question/view/{{ question[0].id }}/';
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while updating the question.');
            });
        });
    </script>
</body>
</html>
