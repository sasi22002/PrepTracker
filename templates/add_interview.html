<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Interview</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            color: #333;
        }
        .container {
            margin-top: 50px;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
            font-weight: 700;
            font-size: 2.5rem;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }
        .form-control {
            border-radius: 10px;
            border: 2px solid #e0e0e0;
            padding: 12px 15px;
            font-size: 16px;
            transition: all 0.3s ease;
            height: 30px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
            transform: translateY(-2px);
        }
        .btn-add {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        .btn-add:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .search-container {
            position: relative;
        }
        .search-results {
            position: absolute;
            background: rgba(255, 255, 255, 0.98);
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        .search-results div {
            padding: 12px 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 1px solid #f0f0f0;
        }
        .search-results div:last-child {
            border-bottom: none;
        }
        .search-results div:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            transform: translateX(5px);
        }
        .btn-link {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-link:hover {
            color: #764ba2;
            text-decoration: none;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            background: linear-gradient(135deg, #5a6268, #495057);
            transform: translateY(-2px);
        }
        .modal-content {
            border-radius: 15px;
            border: none;
        }
        .modal-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 15px 15px 0 0;
            border: none;
        }
        
        /* Terminal style description */
        .terminal-description {
            background: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #333;
            font-size: 14px;
            line-height: 1.4;
            resize: vertical;
            min-height: 100px;
        }
        .terminal-description:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        .terminal-description::placeholder {
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Add New Interview</h1>
        <form id="interviewForm">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" class="form-control" id="date" name="date" required>
            </div>
            <div class="form-group search-container">
                <label for="company">Select Company</label>
                <input type="text" class="form-control" id="companyInput" placeholder="Search or Add Company" required>
                <div id="searchResults" class="search-results"></div>
                <button type="button" class="btn btn-link" data-toggle="modal" data-target="#addCompanyModal">
                    <i class="fas fa-plus"></i> Add New Company
                </button>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select class="form-control select-dropdown" id="status" name="status" required>
                    <option value="">Select Status</option>
                    {% for status_opt in status_options %}
                    <option value="{{ status_opt.status_name }}">{{ status_opt.status_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="state">State</label>
                <select class="form-control select-dropdown" id="state" name="state" required>
                    <option value="">Select State</option>
                    {% for state_opt in state_options %}
                    <option value="{{ state_opt.state_name }}">{{ state_opt.state_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea class="form-control terminal-description" id="description" name="description" rows="3" placeholder="Enter interview description..."></textarea>
            </div>
            <button type="submit" class="btn-add">Add Interview</button>
        </form>
        
        <div class="mt-3">
            <a href="{{ url_for('home') }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

    <!-- Modal for Adding New Company -->
    <div class="modal fade" id="addCompanyModal" tabindex="-1" aria-labelledby="addCompanyModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addCompanyModalLabel">Add New Company</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="companyForm">
                        <div class="form-group">
                            <label for="companyName">Company Name</label>
                            <input type="text" class="form-control" id="companyName" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="addCompany()">Add Company</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        let companies = [];
        let selectedCompany = '';

        // Load companies when page loads
        $(document).ready(function() {
            loadCompanies();
        });

        function loadCompanies() {
            fetch('/api/companies')
                .then(response => response.json())
                .then(data => {
                    companies = data.data;
                })
                .catch(error => console.error('Error loading companies:', error));
        }

        // Search functionality
        $('#companyInput').on('input', function() {
            const query = $(this).val().toLowerCase();
            const searchResults = $('#searchResults');
            
            if (query.length === 0) {
                searchResults.hide();
                return;
            }

            const filteredCompanies = companies.filter(company => 
                company.company_name.toLowerCase().includes(query)
            );

            if (filteredCompanies.length > 0) {
                searchResults.empty();
                filteredCompanies.forEach(company => {
                    searchResults.append(`<div onclick="selectCompany('${company.company_name}')">${company.company_name}</div>`);
                });
                searchResults.show();
            } else {
                searchResults.hide();
            }
        });

        function selectCompany(companyName) {
            $('#companyInput').val(companyName);
            $('#searchResults').hide();
            selectedCompany = companyName;
        }

        // Hide search results when clicking outside
        $(document).click(function(event) {
            if (!$(event.target).closest('.search-container').length) {
                $('#searchResults').hide();
            }
        });

        // Add company functionality
        function addCompany() {
            const companyName = $('#companyName').val();
            
            if (!companyName) {
                alert('Please enter a company name');
                return;
            }

            fetch('/api/add_company', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ company_name: companyName })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Company added successfully!');
                    $('#addCompanyModal').modal('hide');
                    $('#companyName').val('');
                    loadCompanies(); // Reload companies list
                    $('#companyInput').val(companyName);
                    selectedCompany = companyName;
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while adding the company.');
            });
        }

        // Form submission
        $('#interviewForm').on('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                date: $('#date').val(),
                company_name: $('#companyInput').val(),
                status: $('#status').val(),
                state: $('#state').val(),
                description: $('#description').val()
            };

            fetch('/api/add_interview', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Interview added successfully!');
                    window.location.href = '{{ url_for("home") }}';
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while adding the interview.');
            });
        });
    </script>
</body>
</html>
