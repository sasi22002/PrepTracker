<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Interview</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        body {
            background-color: #f7f7f7;
        }
        .container {
            margin-top: 50px;
            max-width: 600px;
            background-color: white;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .btn-save {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-save:hover {
            background-color: #0056b3;
        }
        
        /* Terminal style description */
        .terminal-description {
            background: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #333;
            font-size: 14px;
            line-height: 1.4;
            resize: vertical;
            min-height: 100px;
        }
        .terminal-description:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }
        .terminal-description::placeholder {
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edit Interview</h1>
        <form id="editInterviewForm">
            <input type="hidden" id="interviewId" value="{{ interview.sno }}">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" class="form-control" id="date" name="date" value="{{ interview.date }}" required>
            </div>
            <div class="form-group">
                <label for="company">Company</label>
                <input type="text" class="form-control" id="company" name="company" value="{{ interview.company_name }}" readonly>
                <small class="form-text text-muted">Company cannot be changed after interview creation.</small>
            </div>
            <div class="form-group">
                <label for="status">Status</label>
                <select class="form-control select-dropdown" id="status" name="status" required>
                    <option value="">Select Status</option>
                    {% for status_opt in status_options %}
                    <option value="{{ status_opt.status_name }}" {% if interview.status == status_opt.status_name %}selected{% endif %}>{{ status_opt.status_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="state">State</label>
                <select class="form-control select-dropdown" id="state" name="state" required>
                    <option value="">Select State</option>
                    {% for state_opt in state_options %}
                    <option value="{{ state_opt.state_name }}" {% if interview.state == state_opt.state_name %}selected{% endif %}>{{ state_opt.state_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea class="form-control terminal-description" id="description" name="description" rows="3" placeholder="Enter interview description...">{{ interview.description or '' }}</textarea>
            </div>
            <button type="submit" class="btn-save">Save Changes</button>
        </form>
        
        <div class="mt-3">
            <a href="{{ url_for('view_interview_web', id=interview.sno) }}" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> Back to Interview
            </a>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        $('#editInterviewForm').on('submit', function(e) {
            e.preventDefault();
            
            const formData = {
                id: $('#interviewId').val(),
                date: $('#date').val(),
                status: $('#status').val(),
                state: $('#state').val(),
                description: $('#description').val()
            };

            fetch('/api/edit_interview', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Interview updated successfully!');
                    window.location.href = '{{ url_for("view_interview_web", id=interview.sno) }}';
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while updating the interview.');
            });
        });
    </script>
</body>
</html>
